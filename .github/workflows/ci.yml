name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-windows:
    name: Backend (Windows)
    # Windows is where the application is developed and where every test is known to pass: this job must be green.
    # The integration tests need a SQL Server and are skipped here (GitHub's Windows runners cannot host a SQL Server
    # container); they run in the Linux job below.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TicketSystemTech.sln

      - name: Build
        run: dotnet build TicketSystemTech.sln --no-restore -c Release

      - name: Test
        run: dotnet test TicketSystemTech.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Migrations match the model (a model change without a migration fails here)
        shell: bash
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/TicketSystemTech.Infrastructure --startup-project src/TicketSystemTech.Api --no-build --configuration Release
        env:
          # Only so the application's host can be built; nothing connects to a database and none of these values is a secret.
          ASPNETCORE_ENVIRONMENT: Staging
          Jwt__Secret: ci-only-secret-ci-only-secret-ci-only-1234567890
          Pii__HashKey: ci-only-hash-key-ci-only-hash-key-1234567890
          ConnectionStrings__DefaultConnection: Server=localhost;Database=ci_never_created;Trusted_Connection=True;TrustServerCertificate=True

      - name: Known-vulnerable packages (high and critical fail the build)
        shell: bash
        run: |
          dotnet list TicketSystemTech.sln package --vulnerable --include-transitive | tee audit.txt
          if grep -Eq '\b(High|Critical)\b' audit.txt; then
            echo "::error::A package with a high or critical advisory is referenced. See the output above."
            exit 1
          fi
          # An audit that could not reach the advisory source prints warnings and no advisories, which would pass the check above.
          # So every project must also have been reported on: either "has no vulnerable packages" or a list of them.
          expected=$(dotnet sln TicketSystemTech.sln list | tail -n +3 | wc -l)
          reported=$(grep -Ec 'has no vulnerable packages|has the following vulnerable packages' audit.txt)
          if [ "$reported" -lt "$expected" ]; then
            echo "::error::The audit reported on $reported of $expected projects. Is the package source (nuget.org) reachable?"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows
          path: backend/**/test-results.trx
          if-no-files-found: ignore

  backend-linux:
    name: Backend (Linux, with SQL Server)
    # The Docker target, and the job that runs the integration tests (the who-may-see-what matrix) against a real SQL Server:
    # the Windows job above skips them. A change that loosens an authorisation rule must fail here, so this job blocks a merge
    # like the others (it used to be informative only; it has been green on every run since it was added). Also the one that
    # checks formatting, because the formatter expects the line endings of the platform it runs on and this checkout is the
    # one the repository is stored with.
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Passw0rd_2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Passw0rd_2026 -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # A throwaway container: this password protects nothing. The tests create and drop their own databases on it.
      TST_SQL: "Server=localhost,1433;User Id=sa;Password=Ci_Passw0rd_2026;TrustServerCertificate=True"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TicketSystemTech.sln

      - name: Formatting (dotnet format finds nothing to change)
        run: dotnet format TicketSystemTech.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build TicketSystemTech.sln --no-restore -c Release

      - name: Test (unit and integration)
        run: dotnet test TicketSystemTech.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-linux
          path: backend/**/test-results.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5114

      - name: Dependency audit (high and critical fail the build)
        run: npm audit --audit-level=high

  docker-image:
    name: Docker image
    # Builds the backend image exactly as a deployment would (restore, publish, runtime image) and checks what the image is: .NET 10,
    # pinned by digest, not root, with a health check, and a refusal to start on a bad configuration. It does not block a merge
    # until the steps added with the pinned digests and the health check have been green once.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The base images are pinned by digest
        run: test "$(grep -c '^FROM .*@sha256:' backend/Dockerfile)" = "2"

      - name: Build the image
        run: docker build --tag ticketsystemtech-api:ci backend

      - name: The image runs on .NET 10
        run: docker run --rm --entrypoint dotnet ticketsystemtech-api:ci --list-runtimes | grep "Microsoft.AspNetCore.App 10\."

      - name: The image does not run as root, and can write where it has to
        run: |
          user_id=$(docker run --rm --entrypoint id ticketsystemtech-api:ci -u)
          echo "runs as user id: $user_id"
          test "$user_id" != "0"
          docker run --rm --entrypoint sh ticketsystemtech-api:ci -c "touch /data/uploads/.probe /data/logs/.probe /app/wwwroot/avatars/.probe"

      - name: The image has a health check, and the check reports a dead application as unhealthy
        run: |
          docker inspect --format '{{json .Config.Healthcheck.Test}}' ticketsystemtech-api:ci | grep -- '--healthcheck'
          if docker run --rm --entrypoint dotnet ticketsystemtech-api:ci TicketSystemTech.Api.dll --healthcheck; then
            echo "::error::The health check said 'healthy' with no application running"
            exit 1
          fi

      - name: A server with developer defaults refuses to start and says why
        run: |
          set +e
          output=$(docker run --rm ticketsystemtech-api:ci 2>&1)
          code=$?
          echo "$output"
          test "$code" != "0"
          echo "$output" | grep -q "configuration is invalid"
          echo "$output" | grep -q "Jwt:Secret"
          echo "$output" | grep -q "Frontend:BaseUrl"
