name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-windows:
    name: Backend (Windows)
    # Windows is where the application is developed and where every test is known to pass: this job must be green.
    # The integration tests need a SQL Server and are skipped here (GitHub's Windows runners cannot host a SQL Server
    # container); they run in the Linux job below.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TicketSystemTech.sln

      - name: Build
        run: dotnet build TicketSystemTech.sln --no-restore -c Release

      - name: Test
        run: dotnet test TicketSystemTech.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Migrations match the model (a model change without a migration fails here)
        shell: bash
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/TicketSystemTech.Infrastructure --startup-project src/TicketSystemTech.Api --no-build --configuration Release
        env:
          # Only so the application's host can be built; nothing connects to a database and none of these values is a secret.
          ASPNETCORE_ENVIRONMENT: Staging
          Jwt__Secret: ci-only-secret-ci-only-secret-ci-only-1234567890
          Pii__HashKey: ci-only-hash-key-ci-only-hash-key-1234567890
          ConnectionStrings__DefaultConnection: Server=localhost;Database=ci_never_created;Trusted_Connection=True;TrustServerCertificate=True

      - name: Known-vulnerable packages (high and critical fail the build)
        shell: bash
        run: |
          dotnet list TicketSystemTech.sln package --vulnerable --include-transitive | tee audit.txt
          if grep -Eq '\b(High|Critical)\b' audit.txt; then
            echo "::error::A package with a high or critical advisory is referenced. See the output above."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: backend/**/test-results.trx
          if-no-files-found: ignore

  backend-linux:
    name: Backend (Linux, with SQL Server)
    # The Docker target, and the only job that runs the integration tests (the who-may-see-what matrix) against a real SQL
    # Server. It has been green since its first run, but SQL Server in a container occasionally fails to start, so it still
    # does not block a merge. After a few more green runs, remove continue-on-error.
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Passw0rd_2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Passw0rd_2026 -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # A throwaway container: this password protects nothing. The tests create and drop their own databases on it.
      TST_SQL: "Server=localhost,1433;User Id=sa;Password=Ci_Passw0rd_2026;TrustServerCertificate=True"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TicketSystemTech.sln

      - name: Build
        run: dotnet build TicketSystemTech.sln --no-restore -c Release

      - name: Test (unit and integration)
        run: dotnet test TicketSystemTech.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: backend/**/test-results.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5114

      - name: Dependency audit (high and critical fail the build)
        run: npm audit --audit-level=high

  docker-image:
    name: Docker image
    # Builds the backend image exactly as a deployment would (restore, publish, runtime image) and checks that the runtime in
    # it is .NET 10. Not run anywhere else, so it does not block a merge until it has been green once.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag ticketsystemtech-api:ci backend

      - name: The image runs on .NET 10
        run: docker run --rm --entrypoint dotnet ticketsystemtech-api:ci --list-runtimes | grep "Microsoft.AspNetCore.App 10\."
